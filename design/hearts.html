<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glordu TV – favorite hearts mockup</title>
<!-- Photos come from backup/ (npm run backup); open via npm run serve. -->
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  /* A 1920×1080 "TV" scaled to fit the window, with the controls legend below it. */
  #stage { position: absolute; left: 50%; top: 0; width: 1920px; height: 1080px; transform-origin: top center; }
  #tv { position: absolute; inset: 0; overflow: hidden; background: #000; border-radius: 6px; box-shadow: 0 0 0 2px #333; cursor: pointer; }
  #legend { position: absolute; left: 0; right: 0; top: 1100px; font-size: 26px; color: #aaa; text-align: center; line-height: 1.6; }
  #legend b { color: #fff; font-weight: 500; }
  #legend .on { color: #7fc8ff; }

  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .shadow-text { text-shadow: 0 0 2px rgba(0,0,0,.55), 0 1px 12px rgba(0,0,0,.25); }
  .shadow-icon { filter: drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 1px 12px rgba(0,0,0,.25)); }

  /* The weather corner as on the TV, for scale. */
  .corner { position: absolute; right: 64px; bottom: 48px; font-size: 92px; line-height: 1; white-space: nowrap; }
  .corner .t { font-size: 42px; vertical-align: 9.9px; }
  .corner svg { width: 50px; height: 50px; margin: 0 36px 0 10px; vertical-align: baseline; }

  /* The heart: top-right, same margins as the corner. Only opacity and
     transform animate, which the TV handles without re-rasterizing. */
  #heart { position: absolute; top: 48px; right: 64px; display: flex; align-items: center; opacity: 0; pointer-events: none; }
  #heart svg { width: 72px; height: 72px; display: block; }
  #heart .icon { position: relative; width: 72px; height: 72px; }
  #heart .label { font-size: 28px; margin-right: 20px; }
  #heart.pop { animation: pop 1.6s ease-out forwards; }
  #heart.pop .icon { animation: grow 1.6s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes grow { 0% { transform: scale(0.6); } 14% { transform: scale(1.12); } 24% { transform: scale(1); } 100% { transform: scale(1); } }

  /* Outline ↔ filled: the outline stays; the fill appears or leaves inside it. */
  /* 1.2 s in all: in by 0.12 s, filled by 0.42 s, fading from 0.95 s. */
  #heart.morph { animation: popQuick 1.2s ease-out forwards; }
  #heart.morph .icon { animation: settle 1.2s ease-out forwards; }
  #heart .fill { position: absolute; left: 0; top: 0; transform-origin: 50% 55%; }
  #heart.morph.fav .fill { animation: fillIn 1.2s ease-out forwards; }
  #heart.morph.unfav .fill { animation: fillOut 1.2s ease-in forwards; }
  #heart.morph.rise.fav .fill { animation-name: riseIn; }
  #heart.morph.rise.unfav .fill { animation-name: drainOut; }
  @keyframes popQuick { 0% { opacity: 0; } 10% { opacity: 1; } 79% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes settle { 0% { transform: scale(0.85); } 10% { transform: scale(1); } 100% { transform: scale(1); } }
  /* The fill takes ~0.25 s, starting 0.16 s in. */
  @keyframes fillIn { 0%, 13% { transform: scale(0); } 27% { transform: scale(1.18); } 33%, 100% { transform: scale(1); } }
  @keyframes fillOut { 0%, 13% { transform: scale(1); } 18% { transform: scale(1.1); } 32%, 100% { transform: scale(0); } }
  @keyframes riseIn { 0%, 13% { clip-path: inset(100% 0 0 0); } 35%, 100% { clip-path: inset(0 0 0 0); } }
  @keyframes drainOut { 0%, 13% { clip-path: inset(0 0 0 0); } 35%, 100% { clip-path: inset(100% 0 0 0); } }

  /* Optional: a small, faint heart while a favorite is on screen. */
  #marker { position: absolute; top: 56px; right: 72px; opacity: 0; transition: opacity 0.4s; }
  #marker svg { width: 34px; height: 34px; }
  #marker.on { opacity: 0.55; }
  #heart.pop ~ #marker { opacity: 0; transition: none; }

  /* Side-by-side comparison, top-left. */
  #compare { position: absolute; top: 48px; left: 64px; display: none; }
  #compare.on { display: flex; }
  #compare div { margin-right: 56px; text-align: center; font-size: 24px; }
  #compare svg { width: 72px; height: 72px; display: block; margin: 0 auto 12px; }
</style>
</head>
<body>
<div id="stage">
  <div id="tv">
    <div class="photo" id="photo"></div>
    <div class="corner shadow-text"><span class="t">17°</span><svg class="shadow-icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>18:42</div>
    <div id="heart"><span class="label shadow-text"></span><span class="icon"></span></div>
    <div id="marker"></div>
    <div id="compare"></div>
  </div>
  <div id="legend"></div>
</div>
<script>
(function () {
  'use strict';

  const PHOTOS = [
    '2382e80e-GGB-MarshallBeach-lightSky.jpg',
    '28583e90-McWay+Milky+Way.jpg',
    '2522a546-Sky+Painting.jpg',
    '6324729d-20140310_Iceland_1392-Edit.jpg',
    'cd493017-MorningGlory.jpg',
    '21b2ab4d-Salt_Point.jpg',
  ].map((f) => '../backup/' + encodeURIComponent(f));

  // Material Icons (filled set), 24×24.
  const FILLED = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
  const OUTLINE = 'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z';
  const BROKEN = 'M16.5 3c-.96 0-1.9.25-2.73.69L12 9h3l-3 10 1-9h-3l1.54-5.39C10.47 3.61 9.01 3 7.5 3 4.42 3 2 5.42 2 8.5c0 4.13 4.16 7.18 10 12.5 5.47-4.94 10-8.26 10-12.5C22 5.42 19.58 3 16.5 3z';

  const COLORS = { white: '#fff', red: '#ff5470' };
  const STYLES = ['morph', 'outline', 'broken', 'crossed'];
  const state = { photo: 0, favorites: {}, off: 'morph', rise: true, color: 'white', label: false, marker: false, compare: false };
  let maskId = 0;

  function heartSvg(kind, color) {
    const fill = kind === 'on' || kind === 'marker' ? color : '#fff';
    if (kind === 'crossed') {
      const id = 'cut' + maskId++;
      return '<svg class="shadow-icon" viewBox="0 0 24 24">' +
        '<mask id="' + id + '"><rect width="24" height="24" fill="#fff"/><line x1="3" y1="3" x2="21" y2="21" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></mask>' +
        '<path d="' + OUTLINE + '" fill="#fff" mask="url(#' + id + ')"/>' +
        '<line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
    }
    const d = kind === 'on' || kind === 'marker' ? FILLED : kind === 'broken' ? BROKEN : OUTLINE;
    return '<svg class="shadow-icon" viewBox="0 0 24 24"><path d="' + d + '" fill="' + fill + '"/></svg>';
  }

  function render() {
    document.getElementById('photo').style.backgroundImage = 'url(' + PHOTOS[state.photo] + ')';
    const marker = document.getElementById('marker');
    marker.innerHTML = heartSvg('marker', COLORS[state.color]);
    marker.classList.toggle('on', state.marker && !!state.favorites[state.photo]);
    const compare = document.getElementById('compare');
    compare.classList.toggle('on', state.compare);
    compare.innerHTML = [['on', 'Favorited'], ['outline', '2 Outline'], ['broken', '3 Broken'], ['crossed', '4 Crossed']]
      .map((v) => '<div class="shadow-text">' + heartSvg(v[0], COLORS[state.color]) + v[1] + '</div>').join('');
    renderLegend();
  }

  function toggleFavorite() {
    const on = !state.favorites[state.photo];
    state.favorites[state.photo] = on;
    const heart = document.getElementById('heart');
    const morph = state.off === 'morph';
    heart.querySelector('.icon').innerHTML = morph
      ? heartSvg('outline') + '<div class="fill">' + heartSvg('on', COLORS[state.color]) + '</div>'
      : heartSvg(on ? 'on' : state.off, COLORS[state.color]);
    heart.querySelector('.label').textContent = state.label ? (on ? 'Added to favorites' : 'Removed from favorites') : '';
    heart.className = '';
    void heart.offsetWidth; // restart the animation
    heart.className = 'pop' + (morph ? ' morph ' + (on ? 'fav' : 'unfav') + (state.rise ? ' rise' : '') : '');
    render();
  }

  function renderLegend() {
    const opt = (key, label, on) => '<span class="' + (on ? 'on' : '') + '">' + key + ' ' + label + '</span>';
    document.getElementById('legend').innerHTML =
      '<b>OK</b> (Enter or click) favorite / unfavorite &nbsp; <b>◀ ▶</b> photo (' + (state.photo + 1) + '/' + PHOTOS.length + ')' +
      (state.favorites[state.photo] ? ' &nbsp;<span class="on">♥ favorite</span>' : '') + '<br>' +
      'Style: ' + opt('1', 'outline ↔ filled', state.off === 'morph') +
      (state.off === 'morph' ? ' (' + opt('F', state.rise ? 'fill rises from the bottom' : 'fill grows from the center', true) + ')' : '') +
      ' · unfavorite as ' + opt('2', 'outline', state.off === 'outline') + ' · ' + opt('3', 'broken', state.off === 'broken') + ' · ' + opt('4', 'crossed', state.off === 'crossed') + '<br>' +
      ' &nbsp;|&nbsp; ' + opt('C', 'color: ' + state.color, true) +
      ' &nbsp;|&nbsp; ' + opt('L', 'label', state.label) +
      ' · ' + opt('M', 'marker on favorites', state.marker) +
      ' · ' + opt('A', 'all side by side', state.compare);
  }

  function onKey(e) {
    const k = e.key;
    if (k === 'Enter' || k === ' ') toggleFavorite();
    else if (k === 'ArrowRight') state.photo = (state.photo + 1) % PHOTOS.length;
    else if (k === 'ArrowLeft') state.photo = (state.photo + PHOTOS.length - 1) % PHOTOS.length;
    else if (k >= '1' && k <= '4' && k.length === 1) state.off = STYLES[Number(k) - 1];
    else if (k === 'f' || k === 'F') state.rise = !state.rise;
    else if (k === 'c' || k === 'C') state.color = state.color === 'white' ? 'red' : 'white';
    else if (k === 'l' || k === 'L') state.label = !state.label;
    else if (k === 'm' || k === 'M') state.marker = !state.marker;
    else if (k === 'a' || k === 'A') state.compare = !state.compare;
    else return;
    e.preventDefault();
    if (k !== 'Enter' && k !== ' ') render();
  }

  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1240);
    document.getElementById('stage').style.transform = 'translateX(-50%) scale(' + s + ')';
  }

  render(); fit();
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', onKey);
  document.getElementById('tv').addEventListener('click', toggleFavorite);
})();
</script>
</body>
</html>
